name: Android CI

on:
  push:
    branches:
      - arena/01a07f49-khatago-app
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Run unit tests
        run: |
          mkdir -p app/schemas
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --info 2>&1 | tee gradle-test.log

      - name: Summarize test failure
        if: failure()
        run: |
          echo "### Gradle test failure" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Extracted error lines" >> "$GITHUB_STEP_SUMMARY"
          grep -nE "(^e: | error: |ERROR:|Exception:|Room|KSP|ksp)" gradle-test.log | tail -200 >> "$GITHUB_STEP_SUMMARY" || true
          echo "#### Log tail" >> "$GITHUB_STEP_SUMMARY"
          tail -200 gradle-test.log >> "$GITHUB_STEP_SUMMARY"
          msg=$(grep -E "(^e: | error: |ERROR:)" gradle-test.log | tail -40 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          if [ -z "$msg" ]; then msg=$(tail -40 gradle-test.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'); fi
          echo "::error title=Gradle test failure::$msg"

      - name: Run lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/*.apk
